name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Qt 6.8.3 Shader Tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Parse QML assets
        run: |
          qmlformat_path=$(command -v qmlformat)
          while IFS= read -r -d '' file; do
            "$qmlformat_path" "$file" >/dev/null
          done < <(find assets/quickshell assets/quickshell-settings -name '*.qml' -print0)

      - name: Validate HUD shader assets
        run: |
          qsb_path=$(command -v qsb)
          qsb --help | grep -q -- '--qt6'
          stage="$RUNNER_TEMP/quickshell"
          make install-hud-assets QSB="$qsb_path" QUICKSHELL_DIR="$stage"
          test -s "$stage/WavyHalo.qml"
          test -s "$stage/shaders/wavy-halo.frag.qsb"
          shader_dump=$(qsb --dump "$stage/shaders/wavy-halo.frag.qsb")
          grep -q 'GLSL' <<<"$shader_dump"
          grep -q 'HLSL' <<<"$shader_dump"
          grep -q 'MSL' <<<"$shader_dump"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Reject legacy GTK runtime assets
        run: |
          test ! -e assets/hud.py
          test ! -e assets/settings.py
          ! grep -R -n -E 'gi\.repository|Gtk4LayerShell|VOICE_INPUT_EXTERNAL_HUD|Command::new\("python"\)' src assets
