name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Qt Shader Tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-shader-baker

      - name: Validate HUD shader assets
        run: |
          stage="$RUNNER_TEMP/quickshell"
          make install-hud-assets QSB=/usr/lib/qt6/bin/qsb QUICKSHELL_DIR="$stage"
          test -s "$stage/WavyHalo.qml"
          test -s "$stage/shaders/wavy-halo.frag.qsb"
          shader_dump=$(/usr/lib/qt6/bin/qsb --dump "$stage/shaders/wavy-halo.frag.qsb")
          grep -q 'GLSL' <<<"$shader_dump"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked

      - name: Reject legacy GTK runtime assets
        run: |
          test ! -e assets/hud.py
          test ! -e assets/settings.py
          ! grep -R -n -E 'gi\.repository|Gtk4LayerShell|VOICE_INPUT_EXTERNAL_HUD|Command::new\("python"\)' src assets
