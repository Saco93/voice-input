# Hyprland binding snippet for Voice Input on Omarchy.
# Add this to ~/.config/hypr/bindings.conf or source it from hyprland.conf.
#
# The HUD is a non-focusable Wayland layer surface. The Settings window is a
# regular client, so float and center it at its requested utility-window size.
windowrule = float on, match:class ^org\.quickshell$, match:title ^Voice Input Settings$
windowrule = center on, match:class ^org\.quickshell$, match:title ^Voice Input Settings$
#
# Toggle recording with the compositor binding:
bindd = SUPER CTRL, X, Voice input, exec, voice-input record toggle
#
# Optional live HUD nudging while the overlay is visible:
bind = SUPER CTRL ALT, left, exec, voice-input hud move left
bind = SUPER CTRL ALT, right, exec, voice-input hud move right
bind = SUPER CTRL ALT, up, exec, voice-input hud move up
bind = SUPER CTRL ALT, down, exec, voice-input hud move down
bind = SUPER CTRL ALT, c, exec, voice-input hud center
#
# Optional push-to-talk alternative:
# bind = SUPER CTRL, X, exec, voice-input record start
# bindr = SUPER CTRL, X, exec, voice-input record stop
